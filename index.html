<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="非官方岭南通虚拟交通卡卡面图鉴，卡面展示与设计归档。">
  <title>LNT Gallery - 岭南通卡面图鉴</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <h1 class="brand-title">LNT Gallery</h1>
        <p class="brand-subtitle">岭南通卡面图鉴</p>
      </div>

      <div class="header-center">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
          </svg>
          <input type="search" id="searchInput" class="search-input" placeholder="搜索系列或卡面名称..." autocomplete="off" spellcheck="false">
          <button type="button" id="searchClear" class="search-clear-btn" aria-label="清除搜索" hidden>✕</button>
        </div>
      </div>

      <div class="header-right">
        <div class="stat-badge" aria-label="统计信息">
          <span id="seriesCount">0</span> 系列 · <span id="cardCount">0</span> 卡面
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div id="loadingState" class="loading-wrap" aria-live="polite">
      <div class="spinner"></div>
      <p class="loading-text">正在加载卡面数据...</p>
    </div>

    <div id="seriesContainer" class="series-container" hidden></div>

    <div id="emptyState" class="empty-state" hidden>
      <p class="empty-text">未找到匹配的卡面或系列</p>
    </div>
  </main>

  <footer class="footer">
    <p>非官方项目，仅用于客户端通信研究与卡面设计归档。卡面版权归各自权利人所有。</p>
  </footer>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭预览 (ESC)">✕</button>
    <div class="lightbox-content">
      <img id="lightboxImg" class="lightbox-img" src="" alt="">
      <div class="lightbox-caption">
        <span class="lightbox-title" id="lightboxTitle"></span>
        <span class="lightbox-sub" id="lightboxSub"></span>
      </div>
    </div>
  </div>

  <button class="back-to-top" id="backToTop" type="button" aria-label="回到顶部" title="回到顶部">↑</button>

  <script src="app.js"></script>
</body>
</html>
